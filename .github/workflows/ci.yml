name: CI - MLflow Training Pipeline

on:
  push:
    branches: [master]
    paths:
      - 'MLProject/**'
  workflow_dispatch:
    inputs:
      n_estimators:
        description: 'Jumlah pohon Random Forest'
        required: false
        default: '200'
      max_depth:
        description: 'Max depth pohon'
        required: false
        default: '10'

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Install Dependencies
        run: |
          pip install mlflow==2.19.0 scikit-learn==1.5.2 pandas==2.2.3 \
                      numpy==1.26.4 matplotlib==3.9.2 seaborn==0.13.2

      - name: Run MLflow Project
        env:
          MLFLOW_TRACKING_URI: "file:./mlruns"
        run: |
          mlflow run MLProject/ \
            -P n_estimators=${{ github.event.inputs.n_estimators || '200' }} \
            -P max_depth=${{ github.event.inputs.max_depth || '10' }} \
            --env-manager=local

      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts-run-${{ github.run_number }}
          path: |
            mlruns/
            MLProject/artifacts/
          retention-days: 30

      - name: Commit Model Artifacts
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add MLProject/artifacts/ || true
          git diff --staged --quiet || \
            git commit -m "ci: update model artifacts [run #${{ github.run_number }}]"
          git push || true
